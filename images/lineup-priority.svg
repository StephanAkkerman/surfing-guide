<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a4d68"/>
      <stop offset="100%" stop-color="#0f7a94"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="url(#water2)"/>
  <rect x="0" y="430" width="900" height="90" fill="#f2d9a1"/>
  <path d="M0,430 Q450,418 900,430 L900,440 Q450,428 0,440 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Peak at top, wave peeling both directions down toward shore -->
  <path d="M450,55 C380,90 300,140 230,210 C170,270 130,330 100,390"
        stroke="#ffffff" stroke-width="7" fill="none" opacity="0.95"/>
  <path d="M450,55 C520,90 600,140 670,210 C730,270 770,330 800,390"
        stroke="#ffffff" stroke-width="7" fill="none" opacity="0.95"/>
  <circle cx="450" cy="55" r="9" fill="#ffe066" stroke="#0b3d4a" stroke-width="2"/>
  <text x="450" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Peak</text>

  <!-- Impact zone / whitewater channel markers -->
  <text x="450" y="245" text-anchor="middle" font-size="13" fill="#dff4fa">Left ⟵ peels ⟶ Right</text>

  <!-- Surfer A: deep, closest to the peak = priority -->
  <g transform="translate(410,110)">
    <ellipse cx="0" cy="0" rx="26" ry="9" fill="#1d3557"/>
    <circle cx="0" cy="-10" r="6" fill="#ffffff"/>
    <rect x="-45" y="-6" width="30" height="26" rx="10" fill="#ffe066" stroke="#0b3d4a" stroke-width="2"/>
    <text x="-30" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="#0b3d4a">A</text>
  </g>
  <line x1="140" y1="140" x2="380" y2="115" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="30" y="150" font-size="14" font-weight="700" fill="#ffe066">A: Priority (closest to peak)</text>

  <!-- Surfer B: further along the shoulder, no priority -->
  <g transform="translate(230,205)">
    <ellipse cx="0" cy="0" rx="26" ry="9" fill="#1d3557"/>
    <circle cx="0" cy="-10" r="6" fill="#ffffff"/>
  </g>
  <text x="60" y="195" font-size="14" font-weight="700" fill="#ffffff">B: Down the line — no priority</text>

  <!-- Do-not-drop-in arrow from B trying to take off vs correct pull-back -->
  <g>
    <path d="M230,220 Q210,260 230,300" stroke="#e63946" stroke-width="4" stroke-dasharray="8 6" fill="none"/>
    <polygon points="230,300 218,278 240,282" fill="#e63946"/>
  </g>
  <text x="70" y="335" font-size="12" fill="#ffd6d6">✗ Dropping in on A</text>

  <!-- Paddle-out path through the channel (right side, away from breaking waves) -->
  <path d="M800,420 C760,340 740,260 730,180 C724,140 730,100 750,70"
        stroke="#2a9d8f" stroke-width="5" fill="none"/>
  <polygon points="750,70 730,80 745,95" fill="#2a9d8f"/>
  <text x="780" y="240" font-size="13" font-weight="700" fill="#8be3d6" transform="rotate(-80 780 240)">Paddle out via channel</text>

  <text x="450" y="500" text-anchor="middle" font-size="13" fill="#0b3d4a">Rule: the surfer closest to the curl/peak has right of way — never drop in or snake their position.</text>
</svg>
